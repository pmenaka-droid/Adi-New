<!-- Extends the base layout and sets the page title to Register -->
{% extends 'base.html' %}
{% block title %}Register{% endblock %}


<!-- Begins main content section -->
{% block content %}


<!-- Page Heading -->
<h1>Create a New Account</h1>


<!-- Displays any temporary messages or errors sent by Flask -->
{% with messages = get_flashed_messages() %}
{% if messages %}
 {% for message in messages %}
   <p style="color:red;">{{ message }}</p>
 {% endfor %}
{% endif %}
{% endwith %}


<!-- Creates a form which allows user to enter Email-->
<form method="POST">
<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
</div>


<!-- Creates a form which allows user to enter Username-->
<div class="form-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" required>
</div>


<!-- Creates a form which allows user to enter Password-->
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" required>
</div>


<!--Creates a submit button-->
<button type="submit" class="btn-primary">Register</button>
</form>
<!-- End main content section -->
{% endblock %}
